<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery — Danielle Godwin Kawulusan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #0a0a0a; --darkgray: #141414; --gray: #1e1e1e;
      --red: #c0392b; --red-dim: #7b1c13; --red-glow: #e74c3c;
      --white: #f0f0f0; --muted: #888888; --border: #2a2a2a;
    }
    body { background-color: var(--black); color: var(--white); font-family: Georgia, 'Times New Roman', serif; min-height: 100vh; }
    a { color: var(--red-glow); text-decoration: none; }
    a:hover { color: var(--white); text-decoration: underline; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; background-color: #090909ee; border-bottom: 2px solid var(--red); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 60px; z-index: 9999; }
    nav .brand { font-size: 20px; font-weight: bold; letter-spacing: 2px; color: var(--red-glow); text-transform: uppercase; }
    nav ul { list-style: none; display: flex; gap: 30px; }
    nav ul li a { color: var(--white); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; padding-bottom: 3px; border-bottom: 2px solid transparent; }
    nav ul li a:hover, nav ul li a.active { color: var(--red-glow); border-bottom: 2px solid var(--red-glow); text-decoration: none; }

    /* PAGE */
    .page-content { padding-top: 80px; min-height: 100vh; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* PAGE HEADER */
    .page-header { background: linear-gradient(160deg, #0a0a0a 60%, #1a0404 100%); border-bottom: 2px solid var(--red); padding: 50px 40px 40px; text-align: center; }
    .section-title { font-size: 11px; letter-spacing: 5px; text-transform: uppercase; color: var(--red-glow); margin-bottom: 14px; }
    .page-header h1 { font-size: 42px; color: var(--white); }
    .page-header h1 span { color: var(--red-glow); }
    .page-header p { margin-top: 10px; font-size: 14px; color: var(--muted); }

    /* GALLERY */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 50px 40px; max-width: 1100px; margin: 0 auto; }
    .gallery-item { background: var(--darkgray); border: 1px solid var(--border); overflow: hidden; }
    .gallery-item img { width: 100%; height: 220px; object-fit: cover; display: block; filter: grayscale(30%); transition: filter 0.3s; }
    .gallery-item img:hover { filter: grayscale(0%); }
    .gallery-caption { padding: 12px 14px; font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
    .gallery-placeholder { width: 100%; height: 220px; background: var(--gray); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; letter-spacing: 1px; gap: 8px; }
    .gallery-placeholder .icon { font-size: 34px; }

    /* FOOTER */
    footer { background: #090909; border-top: 1px solid var(--border); text-align: center; padding: 28px 20px; font-size: 12px; color: var(--muted); letter-spacing: 2px; margin-top: 60px; }
    footer span { color: var(--red-glow); }

    @media (max-width: 680px) {
      nav { padding: 0 20px; } nav ul { gap: 16px; } nav ul li a { font-size: 11px; }
      .gallery-grid { padding: 30px 20px; }
    }
  </style>
</head>
